name: Flutter Android - Jogo Duo
on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform from Flutter templates
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --org com.sayvabr --project-name jogo_duo --no-pub .
          sed -i 's/android:label="jogo_duo"/android:label="Jogo Duo"/' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
      - name: Normalize initial Dart port
        working-directory: flutter_app
        run: python3 tool/normalize_sources.py
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Test actual game rules and Flutter home
        working-directory: flutter_app
        run: flutter test test/game_logic_test.dart
      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build native Android APK with Flutter
        working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-duo-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
