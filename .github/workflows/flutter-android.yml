name: Flutter Android · tests and APK
on:
  push:
    branches: [main, flutter-android]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host (Flutter, no WebView or Capacitor)
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name=jogo_duo --org=br.sayva .
          rm -f test/widget_test.dart
      - name: Install packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Test game rules
        working-directory: flutter_app
        run: flutter test
      - name: Build Flutter Android APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-duo-flutter-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
